name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync script unit tests
        run: python -m unittest discover -v tests

      - name: Page script parses
        run: |
          node -e '
            const html = require("fs").readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) throw new Error("no inline <script> found");
            scripts.forEach(src => new Function(src));
            console.log(`OK: ${scripts.length} inline script(s) parse`);
          '

      - name: Data files are valid JSON
        run: |
          for f in data/*.json; do python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }; done
          echo "OK: all data files parse"
